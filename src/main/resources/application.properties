# Activation par défaut du profil local (localhost) s'il n'est pas spécifié
spring.profiles.active=${SPRING_PROFILES_ACTIVE:localhost}

# ===================================================================
# Configuration de la base de données (Spring Batch Metadata)
# ===================================================================
spring.datasource.url=jdbc:h2:file:${app.output-dir:./data}/h2db;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Initialisation automatique du schéma des tables Spring Batch
spring.batch.jdbc.initialize-schema=always

# Désactiver le lancement automatique de tous les Jobs au démarrage.
# Nous contrôlons le lancement manuellement via notre StartupJobRunner / ScheduledJobRunner
spring.batch.job.enabled=false

# ===================================================================
# Configuration des APIs et du Batch
# ===================================================================
app.theses.api-base-url=${THESES_API_BASE_URL:https://v2-test.theses.fr/api/v1}
app.theses.page-size=${THESES_PAGE_SIZE:1000}

app.datagouv.api-key=${DATA_GOUV_API_KEY:}
app.datagouv.dataset-id=${DATA_GOUV_DATASET_ID:}
app.datagouv.csv-resource-id=${DATA_GOUV_CSV_RESOURCE_ID:}
app.datagouv.json-resource-id=${DATA_GOUV_JSON_RESOURCE_ID:}
app.datagouv.ndjson-resource-id=${DATA_GOUV_NDJSON_RESOURCE_ID:}
app.datagouv.upload-enabled=${DATA_GOUV_UPLOAD_ENABLED:false}

app.mode-test=${MODE_TEST:false}
app.output-dir=${OUTPUT_DIR:./data}

# Planification et forçage
app.scheduler.enabled=${SCHEDULER_ENABLED:false}
app.scheduler.cron=${SCHEDULER_CRON:0 0 2 * * ?}
app.force-run=${FORCE_RUN:false}

# Désactiver la bannière Spring Boot au démarrage pour des logs plus propres
spring.main.banner-mode=off

# Configuration de la sérialisation Jackson (exclusion des champs nuls dans les exports JSON/NDJSON)
spring.jackson.default-property-inclusion=non-null

# Configuration des logs
logging.level.fr.abes.theses.batch=INFO
logging.level.org.springframework.batch=INFO
